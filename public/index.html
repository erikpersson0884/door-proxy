<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Door</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Door Control</h1>
    <div id="buttons">
      <button class="btn-open" data-door="1" data-name="Gården">Open Gården</button>
      <button class="btn-close" data-door="2" data-name="Porten">Open Porten</button>
    </div>
    <div id="status"></div>
    <div id="lastUsed"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
